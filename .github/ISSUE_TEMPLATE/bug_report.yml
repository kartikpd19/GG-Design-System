name: Bug report
description: Something in a Good Game component doesn't work or doesn't match Figma
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Button
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or a Storybook link.
      render: tsx
  - type: input
    id: version
    attributes:
      label: "@goodgame/core version"
      placeholder: 0.1.0
  - type: input
    id: browser
    attributes:
      label: Browser and OS
  - type: input
    id: figma
    attributes:
      label: Figma link (if it's a design mismatch)
